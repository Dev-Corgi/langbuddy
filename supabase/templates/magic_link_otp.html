<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!-- Supabase Go template: magic link → OTP by showing {{ .Token }} -->
  <title>Sign-in code</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;padding:40px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:440px;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(15,23,42,0.08);">
          <tr>
            <td style="height:4px;background:linear-gradient(90deg,#6366f1,#14b8a6);"></td>
          </tr>
          <tr>
            <td style="padding:32px 28px 12px;text-align:center;">
              <p style="margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:#6366f1;">LangBuddy</p>
              <h1 style="margin:0 0 12px;font-size:24px;font-weight:800;color:#111827;line-height:1.25;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
                Your sign-in code
              </h1>
              <p style="margin:0;font-size:15px;line-height:1.55;color:#6b7280;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
                Enter this one-time code in the app. It expires shortly.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 28px;text-align:center;">
              <div style="display:inline-block;border-radius:16px;padding:22px 28px;background:linear-gradient(145deg,#f5f3ff 0%,#ecfeff 100%);border:1px solid #c7d2fe;">
                <span style="font-size:34px;font-weight:800;letter-spacing:0.28em;color:#3730a3;font-family:'Segoe UI',Roboto,ui-monospace,monospace;">{{ .Token }}</span>
              </div>
              <p style="margin:22px 0 0;font-size:13px;line-height:1.5;color:#9ca3af;font-family:system-ui,sans-serif;">
                Requested for <strong style="color:#4b5563;">{{ .Email }}</strong>
              </p>
              <p style="margin:16px 0 0;font-size:12px;line-height:1.5;color:#9ca3af;font-family:system-ui,sans-serif;">
                If you didn&apos;t try to sign in, you can ignore this message.
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:20px 0 0;font-size:11px;color:#a1a1aa;font-family:system-ui,sans-serif;">
          Sent by LangBuddy authentication
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
